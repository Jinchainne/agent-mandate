name: Verify AgentMandate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install pytest genlayer-test genvm-linter
      - run: npm test
      - run: npm run verify
      - run: npm run build
      - run: python -m genvm_linter.cli check contracts/agent_mandate.py
